[pytest]
# Phase 1.7: collect only the real test suite.
#
# Without testpaths, pytest imports every test_*.py in the tree -- including
# manual MT5 scripts that call quit() at module level, which aborted the whole
# run with INTERNALERROR. data/test_data.py was renamed to check_data_manual.py
# for the same reason.
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
